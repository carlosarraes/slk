[package]
name = "slk"
version = "0.0.2"
edition = "2024"
rust-version = "1.94"
description = "Read-only, agent-friendly Slack CLI"
license = "MIT"
repository = "https://github.com/carlosarraes/slk"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
htmd = "0.5.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
